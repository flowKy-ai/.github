<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="FlowKy — the sidekick for your coding agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0E06"/>
      <stop offset="100%" stop-color="#2A1206"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A4C"/>
      <stop offset="100%" stop-color="#F0620F"/>
    </linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9560A"/>
      <stop offset="100%" stop-color="#C4430A"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E4"/>
      <stop offset="100%" stop-color="#FFE2C2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A4C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF8A4C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Subtle grid, masked so it fades out rather than ending on a hard edge -->
  <g opacity="0.06">
    <g stroke="#FF8A4C" stroke-width="1">
      <path d="M0 80h1280M0 160h1280M0 240h1280"/>
      <path d="M160 0v320M320 0v320M480 0v320M640 0v320M800 0v320M960 0v320M1120 0v320"/>
    </g>
  </g>

  <circle cx="1010" cy="160" r="190" fill="url(#glow)"/>

  <!-- Mascot -->
  <g transform="translate(890,42) scale(0.98)">
    <!-- Tail sits behind the body -->
    <path d="M172 176c22-6 34-22 30-40-3-14-16-20-24-12-9 9-2 20 8 18"
          fill="none" stroke="url(#furDark)" stroke-width="17" stroke-linecap="round"/>
    <ellipse cx="120" cy="176" rx="60" ry="46" fill="url(#fur)"/>
    <ellipse cx="120" cy="188" rx="34" ry="30" fill="url(#cream)"/>
    <path d="M74 96C52 84 46 58 62 50c15-7 28 14 34 40z" fill="url(#furDark)"/>
    <path d="M166 96C188 84 194 58 178 50c-15-7-28 14-34 40z" fill="url(#furDark)"/>
    <circle cx="120" cy="106" r="58" fill="url(#fur)"/>
    <ellipse cx="120" cy="128" rx="34" ry="26" fill="url(#cream)"/>
    <ellipse cx="99" cy="99" rx="11" ry="12" fill="#FFFFFF"/>
    <ellipse cx="141" cy="99" rx="11" ry="12" fill="#FFFFFF"/>
    <circle cx="99" cy="99" r="6.4" fill="#2A1206"/>
    <circle cx="141" cy="99" r="6.4" fill="#2A1206"/>
    <circle cx="96.8" cy="96.4" r="2.1" fill="#FFFFFF"/>
    <circle cx="138.8" cy="96.4" r="2.1" fill="#FFFFFF"/>
    <path d="M88 84c6-4 14-4 20 0" stroke="#C4430A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M132 84c6-4 14-4 20 0" stroke="#C4430A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="120" cy="118" rx="9.5" ry="7.4" fill="#2A1206"/>
    <path d="M120 126v6" stroke="#2A1206" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M120 132c-6 7-16 5-18-2" stroke="#2A1206" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M120 132c6 7 16 5 18-2" stroke="#2A1206" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M84 152a40 26 0 0 0 72 0" fill="none" stroke="#2A1206" stroke-width="9" stroke-linecap="round"/>
    <circle cx="120" cy="170" r="13" fill="#FFC978" stroke="#2A1206" stroke-width="3.5"/>
    <path d="M114 170l4 4 8-8" fill="none" stroke="#2A1206" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark. System font stack so it renders identically without a webfont,
       which GitHub would not load anyway. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="96" y="150" fill="#FFFFFF" font-size="86" font-weight="800" letter-spacing="-3">FlowKy</text>
    <text x="100" y="200" fill="#FF9D5C" font-size="27" font-weight="600">The sidekick for your coding agent.</text>
    <text x="100" y="244" fill="#FFFFFF" opacity="0.5" font-size="19">
      Stops duplicate code · Breaks retry loops · Keeps the map honest
    </text>
  </g>
</svg>
