<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="FlowKy — the sidekick for your coding agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0E06"/>
      <stop offset="100%" stop-color="#2A1206"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A4C"/>
      <stop offset="100%" stop-color="#F0620F"/>
    </linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9560A"/>
      <stop offset="100%" stop-color="#C4430A"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E4"/>
      <stop offset="100%" stop-color="#FFE2C2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A4C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF8A4C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Subtle grid, masked so it fades out rather than ending on a hard edge -->
  <g opacity="0.06">
    <g stroke="#FF8A4C" stroke-width="1">
      <path d="M0 80h1280M0 160h1280M0 240h1280"/>
      <path d="M160 0v320M320 0v320M480 0v320M640 0v320M800 0v320M960 0v320M1120 0v320"/>
    </g>
  </g>

  <circle cx="1010" cy="160" r="190" fill="url(#glow)"/>

  <!-- Mascot. The head geometry is the avatar's, scaled — one animal across both
       assets rather than two that merely share a palette. -->

  <g transform="translate(0,-16)">

  <!-- Tail, behind the body. A low sweep: the tight curl it replaced read as a
       squirrel once the ears stopped being pointed. -->
  <path d="M1100 262c34 2 54-14 58-40" fill="none" stroke="url(#furDark)"
        stroke-width="18" stroke-linecap="round"/>

  <ellipse cx="1030" cy="252" rx="76" ry="60" fill="url(#fur)"/>
  <ellipse cx="1030" cy="266" rx="44" ry="40" fill="url(#cream)"/>

  <g transform="translate(896.8,18.8) scale(0.5205)">
    <g fill="url(#furDark)">
      <path d="M176 132C120 128 66 190 62 262c-4 68 22 110 60 110 36 0 54-36 50-90-4-58-2-110 18-140z"/>
      <path d="M336 132c56-4 110 58 114 130 4 68-22 110-60 110-36 0-54-36-50-90 4-58 2-110-18-140z"/>
    </g>
    <circle cx="256" cy="252" r="146" fill="url(#fur)"/>
    <ellipse cx="256" cy="308" rx="84" ry="64" fill="url(#cream)"/>
    <circle cx="202" cy="236" r="24" fill="#2A1206"/>
    <circle cx="310" cy="236" r="24" fill="#2A1206"/>
    <circle cx="193.5" cy="227.5" r="8" fill="#FFFFFF"/>
    <circle cx="301.5" cy="227.5" r="8" fill="#FFFFFF"/>
    <ellipse cx="256" cy="292" rx="29" ry="22" fill="#2A1206"/>
    <path d="M256 314v17" stroke="#2A1206" stroke-width="11" stroke-linecap="round"/>
    <path d="M256 331c-15 18-42 12-47-6" stroke="#2A1206" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M256 331c15 18 42 12 47-6" stroke="#2A1206" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Collar tag, the one detail the avatar drops: at 32px it would be mud. -->
  <circle cx="1030" cy="242" r="15" fill="#FFC978" stroke="#2A1206" stroke-width="4"/>
  <path d="M1023 242l5 5 9-9" fill="none" stroke="#2A1206" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- Wordmark. System font stack so it renders identically without a webfont,
       which GitHub would not load anyway. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="96" y="150" fill="#FFFFFF" font-size="86" font-weight="800" letter-spacing="-3">FlowKy</text>
    <text x="100" y="200" fill="#FF9D5C" font-size="27" font-weight="600">The sidekick for your coding agent.</text>
    <text x="100" y="244" fill="#FFFFFF" opacity="0.5" font-size="19">
      Stops duplicate code · Breaks retry loops · Keeps the map honest
    </text>
  </g>
</svg>
